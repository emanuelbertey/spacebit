name: Au - firmas rank 2/3/4 y rank 5 con montos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmas_ranks:
    name: Firmar 3 ranks (2/3/4), 2 firmas por rank
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gadgets
        run: |
          SKIP_EXTRA=gentdrow.c bash test/build/build.sh \
            auditor "$PWD/test-d128/recover_gadget.c" recover_gadget.exe 2>&1
          ./artifacts/recover_gadget.exe > gadget_polys.txt
      - name: Firmar y verificar
        run: |
          set +e
          for rank in 2 3 4; do
            M=$((19 * rank))
            for n in 10 30; do
              tag="r${rank}_n${n}"
              echo "=== rank=$rank M=$M N=$n ==="
              python test-d128/port.py --dim 256 --n-spent $n --M $M \
                --gadget gadget_polys.txt --tg-factor 8 \
                --out "src_$tag" 2>&1 | tee "gen_$tag.log"
              bash test/build/build.sh "$PWD/src_$tag" \
                "$PWD/test-d128/au_d256_sign.c" "firma_$tag.exe" \
                -DBETA=$n -Wl,--stack,134217728 2>&1 | tee "build_$tag.log"
              brc=$?
              if [ "$brc" -ne 0 ]; then
                echo "$brc" > "$PWD/rc_$tag.txt"
                echo "BUILD FAIL rc=$brc" > "$PWD/out_$tag.txt"
                continue
              fi
              "$PWD/artifacts/firma_$tag.exe" > "$PWD/out_$tag.txt" 2>&1
              echo "$?" > "$PWD/rc_$tag.txt"
              cat "$PWD/out_$tag.txt"
            done
          done
          exit 0
      - name: JSON
        if: always()
        shell: pwsh
        run: |
          $casos = @()
          foreach ($rank in @(2,3,4)) {
            foreach ($n in @(10,30)) {
              $tag = "r${rank}_n${n}"
              $rc = -1
              if (Test-Path "rc_$tag.txt") { $rc = [int]((Get-Content "rc_$tag.txt" -Raw).Trim()) }
              $sal = ""
              if (Test-Path "out_$tag.txt") { $sal = Get-Content "out_$tag.txt" -Raw }
              $casos += [pscustomobject]@{ rank=$rank; n=$n; rc=$rc; verificacion=($rc -eq 0); salida=$sal }
            }
          }
          [pscustomobject]@{ casos=$casos } | ConvertTo-Json -Depth 4 | Set-Content firmas.json -Encoding utf8
          Get-Content firmas.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srank-firmas
          path: firmas.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srank-log
          path: |
            gen_*.log
            build_*.log
            out_*.txt
          if-no-files-found: warn

  firmas_rank5_montos:
    name: Firmar rank 5 y comprobar montos
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gadgets
        run: |
          SKIP_EXTRA=gentdrow.c bash test/build/build.sh \
            auditor "$PWD/test-d128/recover_gadget.c" recover_gadget.exe 2>&1
          ./artifacts/recover_gadget.exe > gadget_polys.txt
      - name: Firmar y comprobar montos
        run: |
          set +e
          rank=5
          M=$((19 * rank))
          n=10
          tag="r${rank}_n${n}"
          echo "=== rank=$rank M=$M N=$n ==="
          python test-d128/port.py --dim 256 --n-spent $n --M $M \
            --gadget gadget_polys.txt --tg-factor 8 \
            --out "src_$tag" 2>&1 | tee "gen_$tag.log"
          bash test/build/build.sh "$PWD/src_$tag" \
            "$PWD/test-d128/au_d256_sign.c" "firma_$tag.exe" \
            -DBETA=$n -Wl,--stack,134217728 2>&1 | tee "build_$tag.log"
          brc=$?
          if [ "$brc" -ne 0 ]; then
            echo "$brc" > "$PWD/rc_$tag.txt"
            echo "BUILD FAIL rc=$brc" > "$PWD/out_$tag.txt"
          else
            "$PWD/artifacts/firma_$tag.exe" > "$PWD/out_$tag.txt" 2>&1
            echo "$?" > "$PWD/rc_$tag.txt"
          fi
          cat "$PWD/out_$tag.txt"
          exit 0
      - name: JSON
        if: always()
        shell: pwsh
        run: |
          $rc = -1
          if (Test-Path "rc_r5_n10.txt") { $rc = [int]((Get-Content "rc_r5_n10.txt" -Raw).Trim()) }
          $sal = ""
          if (Test-Path "out_r5_n10.txt") { $sal = Get-Content "out_r5_n10.txt" -Raw }
          [pscustomobject]@{ rank=5; n=10; rc=$rc; verificacion=($rc -eq 0); salida=$sal } |
            ConvertTo-Json -Depth 4 | Set-Content montos.json -Encoding utf8
          Get-Content montos.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srank-montos
          path: montos.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srank-log-montos
          path: |
            gen_*.log
            build_*.log
            out_*.txt
          if-no-files-found: warn
