name: Reproduccion estimador paper MatRiCT+

# Manual. Compara el estimador original del paper (ASIS_est.sage) con nuestro
# estimador modificado, usando los parametros publicados y ambos moduli.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: Reproducir ASIS_est.sage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correr reproduccion
        shell: bash
        run: |
          set +e
          python security/paper_repro.py 2>&1 | tee paper_repro.log
          rc=${PIPESTATUS[0]}
          set -e
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-repro-log
          path: paper_repro.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-repro
          path: security/paper_repro.json
          if-no-files-found: error
