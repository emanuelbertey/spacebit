name: Compilar binarios (solo build, sin ejecutar tests)

on:
  workflow_dispatch:

permissions:
  contents: read

# Dos variantes: auditor y plus. Un .exe por variante.
# Toda la logica de compilacion esta en un solo script: test/build/build.sh
jobs:
  auditor:
    name: Auditor - compilar
    runs-on: windows-latest
    env:
      SRC: auditor
      MAIN: test_todos.c
      OUT: auditor.exe
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Compilar auditor.exe
        run: bash test/build/build.sh "$SRC" "$MAIN" "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: auditor-binario
          path: artifacts/auditor.exe
          if-no-files-found: error

  plus:
    name: Plus - compilar
    runs-on: windows-latest
    env:
      SRC: plus
      MAIN: test.c
      OUT: plus.exe
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Compilar plus.exe
        run: bash test/build/build.sh "$SRC" "$MAIN" "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plus-binario
          path: artifacts/plus.exe
          if-no-files-found: error

  mil_llaves:
    name: Prueba 1000 llaves (1 vuelta) - compilar
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: au_1k.exe
        run: bash test/build/build.sh auditor test/au_1k_1vuelta.c au_1k.exe -DBETA=1000 -Wl,--stack,67108864
      - name: plus_1k.exe
        run: bash test/build/build.sh plus test/plus_1k_1vuelta.c plus_1k.exe -DN_SPENT=1000 -Wl,--stack,67108864
      - name: falsificacion_rango_alto.exe (anillo 100)
        run: bash test/build/build.sh auditor test/falsificacion_rango_alto.c falsificacion_rango_alto.exe
      - name: falsificacion_agresiva.exe (anillo 100)
        run: bash test/build/build.sh auditor test/falsificacion_agresiva.c falsificacion_agresiva.exe
      - name: au_d256_intento.exe
        run: bash test/build/build.sh auditor test/au_d256_intento.c au_d256_intento.exe -DD=256
      - uses: actions/upload-artifact@v4
        with:
          name: mil-llaves
          path: |
            artifacts/*_1k.exe
            artifacts/falsificacion_rango_alto.exe
            artifacts/falsificacion_agresiva.exe
            artifacts/au_d256_intento.exe
          if-no-files-found: error
