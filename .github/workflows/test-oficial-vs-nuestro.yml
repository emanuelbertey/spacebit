name: Test OFICIAL vs NUESTRO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: OFICIAL D64 vs NUESTRO D256
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correr
        shell: bash
        run: |
          set +e
          python security/test_oficial_vs_nuestro.py 2>&1 | tee oficial_vs_nuestro.log
          rc=${PIPESTATUS[0]}
          set -e
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oficial-vs-nuestro
          path: |
            security/test_oficial_vs_nuestro.json
            oficial_vs_nuestro.log
          if-no-files-found: warn
