name: Verificacion geometrica SIS (paper)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geom:
    name: Geometria de los ataques
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correr verificacion
        shell: bash
        run: |
          set +e
          python security/geom_check.py 2>&1 | tee geom_check.log
          rc=${PIPESTATUS[0]}
          set -e
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geom-check
          path: |
            security/geom_check.json
            geom_check.log
          if-no-files-found: warn
