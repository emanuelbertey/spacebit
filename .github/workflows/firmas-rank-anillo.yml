name: Firmas Au256 por rank y anillo

# Manual. Solo firmas: rank 2/3/4 (M = 19*rank) x anillos 10/30/50.
# Cada caso: keygen+mint+spend+verify, montos y auditoria de llave.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmas:
    name: Firmar/verificar
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Recuperar gadget
        shell: bash
        run: |
          SKIP_EXTRA=gentdrow.c bash test/build/build.sh \
            auditor "$PWD/test-d128/recover_gadget.c" recover_gadget.exe
          ./artifacts/recover_gadget.exe > gadget_polys.txt

      - name: Firmar rank 2/3/4 x anillo 10/30/50
        shell: bash
        run: |
          set +e
          for rank in 2 3 4; do
            M=$((19 * rank))
            for n in 10 30 50; do
              tag="r${rank}_n${n}"
              echo "=== rank=$rank M=$M N_SPENT=$n ==="
              python test-d128/port.py --dim 256 --n-spent $n \
                --gadget gadget_polys.txt --tg-factor 8 \
                --M "$M" --out "src_$tag" 2>&1 | tee "gen_$tag.log"
              bash test/build/build.sh "$PWD/src_$tag" \
                "$PWD/test-d128/au_d256_sign.c" "firma_$tag.exe" \
                -DBETA=$n -Wl,--stack,134217728 2>&1 | tee "build_$tag.log"
              if [ $? -ne 0 ]; then
                echo "BUILD FAIL" > "out_$tag.txt"
                echo 1 > "rc_$tag.txt"
                continue
              fi
              "$PWD/artifacts/firma_$tag.exe" > "out_$tag.txt" 2>&1
              echo $? > "rc_$tag.txt"
              cat "out_$tag.txt"
            done
          done
          exit 0

      - name: Resultado JSON
        if: always()
        shell: pwsh
        run: |
          $casos = @()
          foreach ($rank in @(2,3,4)) {
            foreach ($n in @(10,30,50)) {
              $tag = "r${rank}_n${n}"
              $rc = -1
              if (Test-Path "rc_$tag.txt") { $rc = [int]((Get-Content "rc_$tag.txt" -Raw).Trim()) }
              $sal = ""
              if (Test-Path "out_$tag.txt") { $sal = Get-Content "out_$tag.txt" -Raw }
              $casos += [pscustomobject]@{
                rank=$rank; n_spent=$n; exit_code=$rc
                verificacion=($rc -eq 0); salida=$sal
              }
            }
          }
          [pscustomobject]@{ dim=256; casos=$casos } |
            ConvertTo-Json -Depth 4 | Set-Content firmas_rank.json -Encoding utf8
          Get-Content firmas_rank.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmas-rank-anillo
          path: |
            firmas_rank.json
            gen_*.log
            build_*.log
            out_*.txt
          if-no-files-found: warn
