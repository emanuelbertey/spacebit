name: Test subir parametros (h)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Subir h (ranks)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correr
        shell: bash
        run: |
          set +e
          python security/test_subir_parametros.py 2>&1 | tee subir_parametros.log
          rc=${PIPESTATUS[0]}
          set -e
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subir-parametros
          path: |
            security/test_subir_parametros.json
            subir_parametros.log
          if-no-files-found: warn
