name: Tres barridos (ranks, n, cotas)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  barridos:
    name: Barridos
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correr
        shell: bash
        run: |
          set +e
          python security/tres_barridos.py 2>&1 | tee tres_barridos.log
          rc=${PIPESTATUS[0]}
          set -e
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tres-barridos
          path: |
            security/tres_barridos.json
            tres_barridos.log
          if-no-files-found: warn
