name: Au D=128 (port real)

# Porta el esquema Au de D=64 a D=128 y lo compila/corre de verdad.
#
# D=128 es el maximo posible sin cambiar los modulos: el NTT de qbig necesita
# una raiz de orden 2D, y QBIG2-1 solo tiene 2^8 (2D <= 256 => D <= 128).
#
# Todo se calcula en Actions:
#   job "port_y_auditoria" (ubuntu): recupera el gadget con el codigo D=64
#     original, genera auditor_d128/, audita parametros a D=128 y sube las
#     fuentes portadas + el JSON de auditoria.
#   job "au_d128" (windows/msys2): baja las fuentes portadas, compila y corre
#     la ronda completa (keygen+mint+spend+verify) + autotests de NTT, y sube
#     resultado_d128.json.
#
# `auditor/` original NO se modifica en el repo.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port_y_auditoria:
    name: Portar a D=128 y auditar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Recupera los polinomios del gadget usando la implementacion ORIGINAL
      # (D=64). gentdrow.c se incluye en el helper, por eso se excluye de LIB.
      - name: Recuperar gadget D=64
        shell: bash
        run: |
          SKIP_EXTRA=gentdrow.c bash test/build/build.sh \
            auditor "$PWD/test-d128/recover_gadget.c" recover_gadget.exe
          ./artifacts/recover_gadget.exe > gadget_polys.txt
          wc -l gadget_polys.txt

      # Fuentes que se compilan/corren en el job de Windows. TG x8 da margen a
      # las firmas honestas (el port es experimental, no un parametro auditado).
      - name: Generar auditor_d128 (test, TG x8)
        shell: bash
        run: |
          set +e
          python test-d128/port.py --gadget gadget_polys.txt --tg-factor 8 --out auditor_d128 2>&1 | tee port_d128.log
          rc=${PIPESTATUS[0]}
          set -e
          exit $rc

      # Copia separada con TG de fabrica para la auditoria estatica.
      - name: Generar copia para auditoria (TG de fabrica)
        shell: bash
        run: python test-d128/port.py --tg-factor 1 --out auditor_d128_audit

      - name: Auditar parametros con D=128
        shell: bash
        run: |
          rm -rf auditor
          mv auditor_d128_audit auditor
          rc=0
          python security/audit_config.py || rc=$?
          cp security/audit_report.json audit_report_d128.json
          exit $rc

      - name: Resumen de auditoria
        if: always()
        shell: bash
        run: |
          {
            echo "## Auditoria de parametros (D=128)"
            echo '```json'
            cat audit_report_d128.json 2>/dev/null || echo '{"error":"sin reporte"}'
            echo '```'
            echo "## Log del port"
            echo '```'
            cat port_d128.log 2>/dev/null || echo '(sin log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: au-d128-fuentes
          path: auditor_d128
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: au-d128-auditoria
          path: audit_report_d128.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: au-d128-log-port
          path: port_d128.log
          if-no-files-found: warn

  au_d128:
    name: Au D=128 - compilar y correr
    needs: port_y_auditoria
    if: always()
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - uses: actions/download-artifact@v4
        with:
          name: au-d128-fuentes
          path: auditor_d128

      - name: Verificar fuentes portadas
        run: |
          grep -E '^#define D ' auditor_d128/poly_param.h
          grep -E 'HASH_OUTPUT_LEN' auditor_d128/param.h

      - name: Compilar Au D=128
        run: |
          set +e
          bash test/build/build.sh "$PWD/auditor_d128" \
            "$PWD/test-d128/au_dim_grande.c" au_d128.exe -Wl,--stack,134217728 2>&1 | tee compile_d128.log
          rc=${PIPESTATUS[0]}
          set -e
          exit $rc

      - name: Correr prueba (D=128)
        if: always()
        run: |
          set +e
          timeout 1800 "$PWD/artifacts/au_d128.exe" > "$PWD/salida_d128.txt" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$PWD/rc_d128.txt"
          cat "$PWD/salida_d128.txt"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: au-d128-compile-log
          path: compile_d128.log
          if-no-files-found: warn

      - name: Armar JSON del resultado
        if: always()
        shell: pwsh
        run: |
          $rc = -1
          if (Test-Path rc_d128.txt) { $rc = [int]((Get-Content rc_d128.txt -Raw).Trim()) }
          $salida = ""
          if (Test-Path salida_d128.txt) { $salida = Get-Content salida_d128.txt -Raw }
          [pscustomobject]@{
            dim = 128
            tg_factor = 8
            exit_code = $rc
            verificacion = ($rc -eq 0)
            salida = $salida
          } | ConvertTo-Json -Depth 3 | Set-Content -Path resultado_d128.json -Encoding utf8
          Get-Content resultado_d128.json
          "## Resultado D=128" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          "exit_code=$rc verificacion=$($rc -eq 0)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: au-d128-resultado
          path: resultado_d128.json
          if-no-files-found: error

      - name: Estado final de la prueba
        if: always()
        run: |
          rc=$(cat rc_d128.txt 2>/dev/null || echo 127)
          if [ "$rc" -ne 0 ]; then
            echo "Prueba D=128 FALLO (rc=$rc)" >&2
            exit 1
          fi
          echo "Prueba D=128 OK (rc=0)"
