name: Au en dim mas grande (D=256)

# Prueba el esquema Au con dimension de anillo mayor (D=256 en vez de 64).
# Test nuevo en test-d256/au_dim_grande.c; no toca ninguna fuente original.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  au_d256:
    name: Au con D=256 - compilar y correr
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      # OJO: auditor/poly_param.h fija "#define D 64LL" sin #ifndef, asi que
      # -DD=256 lo pisa el header. Para probar D=256 de verdad se compila
      # sobre una COPIA con D=256; el repo original queda intacto.
      - name: Compilar Au real D=256 (copia temporal)
        run: |
          tmp="$HOME/spacebit-d256-build"
          rm -rf "$tmp"
          cp -r "$PWD/." "$tmp"
          sed -i -E 's/#define[[:space:]]+D[[:space:]]+64LL/#define D 256LL/' "$tmp/auditor/poly_param.h"
          cd "$tmp"
          bash test/build/build.sh auditor "$PWD/test-d256/au_dim_grande.c" au_dim_grande.exe -Wl,--stack,67108864
      - name: Correr prueba (D=256)
        if: always()
        run: |
          set +e
          "$HOME/spacebit-d256-build/artifacts/au_dim_grande.exe" > "$PWD/salida_d256.txt" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$PWD/rc_d256.txt"
          cat "$PWD/salida_d256.txt"
          exit 0
      - name: Armar JSON del resultado
        if: always()
        shell: pwsh
        run: |
          $rc = -1
          if (Test-Path rc_d256.txt) { $rc = [int]((Get-Content rc_d256.txt -Raw).Trim()) }
          $salida = ""
          if (Test-Path salida_d256.txt) { $salida = Get-Content salida_d256.txt -Raw }
          [pscustomobject]@{
            dim = 256
            exit_code = $rc
            verificacion = ($rc -eq 0)
            salida = $salida
          } | ConvertTo-Json -Depth 3 | Set-Content -Path resultado_d256.json -Encoding utf8
          Get-Content resultado_d256.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: au-dim-grande-resultado
          path: resultado_d256.json
          if-no-files-found: error

  auditoria:
    name: Auditoria de parametros y parches (D=256)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Audita sobre una COPIA con D=256; el repo original queda intacto.
      - name: Auditar parametros con D=256
        shell: bash
        run: |
          tmp="$RUNNER_TEMP/spacebit-d256"
          rm -rf "$tmp"
          cp -r "$GITHUB_WORKSPACE/." "$tmp"
          sed -i -E 's/#define[[:space:]]+D[[:space:]]+64LL/#define D 256LL/' "$tmp/auditor/poly_param.h"
          rc=0
          python "$tmp/security/audit_config.py" || rc=$?
          cp "$tmp/security/audit_report.json" audit_report_d256.json
          exit $rc
      - name: Publicar en el resumen
        if: always()
        shell: bash
        run: |
          echo "## Auditoria de parametros (D=256)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat audit_report_d256.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: au-dim-grande-auditoria
          path: audit_report_d256.json
          if-no-files-found: error
