name: Validar componentes del modelo SIS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Bateria de validacion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correr validacion
        shell: bash
        run: |
          set +e
          python security/validar_modelo.py 2>&1 | tee validar_modelo.log
          rc=${PIPESTATUS[0]}
          set -e
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validar-modelo
          path: |
            security/validar_modelo.json
            validar_modelo.log
          if-no-files-found: warn
